# DailyTodo/gradle.properties
#
# 说明：Gradle 发行包（gradle-8.7-bin.zip）的下载地址不在这个文件里，
# 在 gradle/wrapper/gradle-wrapper.properties 的 distributionUrl，那里已换成腾讯云镜像。
# 本文件只放 JVM 参数、超时与 Android 构建开关。

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 弱网环境放宽 HTTP 超时，避免大依赖下到一半被判定超时（默认 30 秒太短）
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

android.useAndroidX=true
android.enableJetifier=false
# 只生成自己模块的 R 类，减少无用常量
android.nonTransitiveRClass=true
kotlin.code.style=official
