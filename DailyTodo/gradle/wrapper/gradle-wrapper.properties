# DailyTodo/gradle/wrapper/gradle-wrapper.properties
#
# Gradle 发行包下载地址。默认指向 services.gradle.org，国内几乎下载不动，
# 已改为腾讯云镜像（速度稳定）。想换阿里云就把下面这一行改成：
#   distributionUrl=https\://mirrors.aliyun.com/gradle/gradle-8.7-bin.zip
#
# 注意：validateDistributionUrl 关掉了 —— 开着它会先对下载地址做一次校验请求，
# 某些镜像对校验请求响应不理想，会误判为非法地址。

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
